# === Shared ===
seed: 314

# === SFT data prep ===
raw_data_path: /scratch/gp50/zs5704/datasets/mimic-data/
processed_data_path: data/processed_data.parquet
dataset_name: MIMIC-III-CLEAN
remove_lab_results: true
dataset_path: data/datasets/
prepare:
  target_type: icd9
  target_columns: '["diagnoses_code","procedure_code"]'
  batch_size: 4096
  split_path: data/splits/mimiciii_clean_splits.feather
  truncation_side: left
seq_len: 4096

# === SFT train ===
model_name: Qwen/Qwen3-4B-Base
train:
  ckp_path: none
  module: label_cross_attention
  lr: 5e-4
  max_epochs: 15
  batch_size: 4
  update_batch: 64
  loss_weights: none
  hidden_state_index: -1
  unfreeze: lora
  n_blocks: 0
  log_code_types: all
  lora_config:
    lora_config:
      r: 32
      lora_alpha: 16
      target_modules: '[q_proj, k_proj, v_proj, o_proj, up_proj, down_proj]'
      lora_dropout: 0.1
      bias: none
  logger:
    logger:
      project: study2_gadi
      save_dir: .wandb/

# === SFT evaluate (val threshold sweep + test predictions) ===
evaluate_sft:
  ckpt_path: models/model.ckpt
  batch_size: 64

# === LLM gap-fill / verification (shared) ===
model: openai/gpt-oss-20b            # LLM used by gap_analysis/verification
reasoning_effort: low
max_output_tokens:
max_concurrent: 96
threshold:                           # auto from optimal_thresholds.json[micro] after evaluate_sft; set explicitly for a manual sweep
description_column: LONG_TITLE
code_type: ICD-9

# === LLM paths ===
code_description_path: /scratch/gp50/zs5704/datasets/mimic-data/mimic-iii-clinical-database-1.4/
output_dir: outputs
guidelines_path: /scratch/gp50/zs5704/projects/prompt-icd/datasets/guidelines/icd9cm_guidelines.parquet

search:
  top_k: 5
  min_score: 0.015
  mrconso_path: /scratch/gp50/zs5704/datasets/umls/MRCONSO.RRF

verification:
  top_n: 5
  chunk_size: 20
  threshold_low:                     # auto from optimal_thresholds.json[macro] after evaluate_sft; set explicitly for a manual sweep
  separate_by_code_type: false

# === Eval ===
eval:
  tau_macro: 
  tau_micro: 
