[project]
name = "hybrid-gap"
version = "0.1.0"
description = "Hybrid pipeline for automated ICD coding combining a fine-tuned LLM classifier with LLM-based gap-filling, verification, and code search over MIMIC-III/IV."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Sandy Sa", email = "sandysa0727@gmail.com" },
]
keywords = [
  "icd-coding",
  "clinical-nlp",
  "mimic",
  "llm",
  "medical-coding",
  "clinical-coding",
  "supervised-fine-tuning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# [project.urls] intentionally omitted until the repo has a public home.
# Add it back as a single block once the canonical Homepage/Repository/Issues
# URLs are known (e.g. after de-anonymization or upon publication).

dependencies = [
  "bm25s",
  "datasets",
  "dvc",
  "huggingface-hub",
  "ipykernel",
  "ipython",
  "jsonargparse",
  "lightning",
  "matplotlib",
  "nbconvert",
  "notebook",
  "numpy",
  "openai",
  "pandas",
  "peft",
  "polars",
  "pyarrow",
  "pydantic",
  "pypdf",
  "PyStemmer",
  "python-dotenv",
  "pyyaml",
  "scikit-learn",
  "scipy",
  "tiktoken",
  "torch",
  "torchmetrics",
  "tqdm",
  "transformers",
  "wandb",
]


[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[tool.uv]
environments = [
  "python_full_version == '3.12.*' and (sys_platform == 'linux' or sys_platform == 'win32')"
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
  "E501",  # line-length is enforced by formatter only; long literal strings in this repo are intentional
]

[tool.ruff.lint.per-file-ignores]
# Existing scripts are out of scope for this pass; quiet lint there so CI stays green
# without touching their bodies. Cleanup is tracked in docs/known-issues.md.
"verification.py" = ["E", "F", "W", "I", "UP"]
"gap_analysis.py" = ["E", "F", "W", "I", "UP"]
"train.py" = ["E", "F", "W", "I", "UP"]
"prepare.py" = ["E", "F", "W", "I", "UP"]
"pre_process.py" = ["E", "F", "W", "I", "UP"]
"evaluate_sft.py" = ["E", "F", "W", "I", "UP"]
"extraction.py" = ["E", "F", "W", "I", "UP"]
"search.py" = ["E", "F", "W", "I", "UP"]
"coding/**/*.py" = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
